<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ARIA — Your Companion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060814">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#060814;
    --panel:#0F1530;
    --panel-line:#232B55;
    --cyan:#5FD9E8;
    --cyan-dim:#2A6E78;
    --gold:#E8C468;
    --text:#EAF0FF;
    --text-dim:#8591B8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(900px 600px at 50% -10%, #152046 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; overflow:hidden; display:flex; flex-direction:column;
  }

  /* ---------- Start overlay ---------- */
  #startOverlay{
    position:fixed; inset:0; z-index:50;
    background:radial-gradient(900px 600px at 50% 30%, #152046 0%, var(--bg) 65%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  #startOverlay .ring{
    width:110px; height:110px; border-radius:50%; border:2px solid var(--cyan-dim);
    display:flex; align-items:center; justify-content:center; margin-bottom:22px;
    animation: slowspin 6s linear infinite;
  }
  #startOverlay .ring::before{
    content:''; width:70px; height:70px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #9FF1FA, var(--cyan) 50%, var(--cyan-dim) 100%);
    box-shadow:0 0 40px rgba(95,217,232,0.55);
  }
  @keyframes slowspin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }
  #startOverlay h1{ font-size:26px; letter-spacing:0.12em; color:var(--cyan); margin:0 0 8px; font-weight:700; }
  #startOverlay p{ color:var(--text-dim); font-size:14px; max-width:280px; line-height:1.6; margin:0 0 26px; }
  #startBtn{
    background:linear-gradient(135deg, var(--cyan), #3FA9B8); color:#031015; border:none; border-radius:30px;
    padding:14px 34px; font-size:15px; font-weight:700; letter-spacing:0.03em;
    box-shadow:0 0 30px rgba(95,217,232,0.35);
  }

  /* ---------- Top bar ---------- */
  .topbar{ padding:calc(12px + env(safe-area-inset-top,0px)) 18px 8px; text-align:center; flex:0 0 auto; }
  .topbar .name{ font-size:13px; letter-spacing:0.3em; color:var(--cyan); font-weight:700; }
  .topbar .sub{ font-size:10.5px; color:var(--text-dim); margin-top:4px; letter-spacing:0.05em; }

  /* ---------- Views ---------- */
  .view{ display:none; flex:1 1 auto; min-height:0; flex-direction:column; }
  .view.active{ display:flex; }

  /* ----- ARIA chat view ----- */
  .orb-wrap{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; padding:10px 0 4px; }
  .orb{ position:relative; width:100px; height:100px; }
  .orb .core{
    position:absolute; inset:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #BDF8FF, var(--cyan) 45%, var(--cyan-dim) 100%);
    box-shadow:0 0 50px rgba(95,217,232,0.5); transition:all .25s ease;
  }
  .orb .ring1, .orb .ring2{ position:absolute; inset:0; border-radius:50%; border:1.5px solid rgba(95,217,232,0.35); }
  .orb .ring2{ inset:8px; border-color:rgba(232,196,104,0.3); }
  .orb.idle .core{ animation: breathe 3.2s ease-in-out infinite; }
  .orb.listening .core{ animation: listening 0.9s ease-in-out infinite; background:radial-gradient(circle at 35% 30%, #FFF3C9, var(--gold) 45%, #8A6D2E 100%); box-shadow:0 0 60px rgba(232,196,104,0.6); }
  .orb.speaking .core{ animation: speaking 0.5s ease-in-out infinite; }
  .orb.listening .ring1{ animation: ringpulse 1.1s ease-out infinite; }
  .orb.speaking .ring2{ animation: ringpulse 0.6s ease-out infinite; }
  @keyframes breathe{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  @keyframes listening{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  @keyframes speaking{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
  @keyframes ringpulse{ 0%{transform:scale(0.9); opacity:0.8;} 100%{transform:scale(1.5); opacity:0;} }
  .state-label{ text-align:center; font-size:11px; color:var(--text-dim); letter-spacing:0.08em; height:16px; flex:0 0 auto; }
  .chat{ flex:1 1 auto; overflow-y:auto; padding:10px 16px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .bubble{ max-width:84%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.55; }
  .bubble.aria{ align-self:flex-start; background:var(--panel); border:1px solid var(--panel-line); color:var(--text); border-bottom-left-radius:4px; }
  .bubble.user{ align-self:flex-end; background:linear-gradient(135deg, var(--cyan-dim), #1C4752); color:#EAFBFF; border-bottom-right-radius:4px; }
  .bubble.aria .tag{ color:var(--cyan); font-size:10px; letter-spacing:0.1em; display:block; margin-bottom:3px; }
  .quickrow{ display:flex; gap:8px; padding:0 16px 8px; overflow-x:auto; flex:0 0 auto; }
  .quickchip{ flex:0 0 auto; background:var(--panel); border:1px solid var(--panel-line); color:var(--text-dim); font-size:11.5px; padding:7px 13px; border-radius:16px; white-space:nowrap; }
  .controls{ flex:0 0 auto; padding:8px 16px 10px; display:flex; align-items:center; gap:10px; }
  .textinput{ flex:1; background:var(--panel); border:1px solid var(--panel-line); border-radius:22px; padding:11px 16px; color:var(--text); font-size:13.5px; }
  .textinput::placeholder{ color:var(--text-dim); }
  .micbtn{ flex:0 0 auto; width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg, var(--cyan), #2A6E78); display:flex; align-items:center; justify-content:center; box-shadow:0 0 18px rgba(95,217,232,0.4); }
  .micbtn.active{ background:linear-gradient(135deg, var(--gold), #8A6D2E); box-shadow:0 0 18px rgba(232,196,104,0.5); }
  .micbtn svg{ width:19px; height:19px; }
  .sendbtn{ flex:0 0 auto; width:42px; height:42px; border-radius:50%; background:var(--panel); border:1px solid var(--panel-line); display:flex; align-items:center; justify-content:center; color:var(--cyan); font-size:16px; }

  /* ----- generic scroll view ----- */
  .scrollview{ flex:1 1 auto; overflow-y:auto; padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)); min-height:0; }
  .section-title{ font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--cyan); margin:0 0 10px; font-weight:700; }
  .empty-card{
    background:var(--panel); border:1px dashed var(--panel-line); border-radius:14px; padding:20px;
    text-align:center; color:var(--text-dim); font-size:12.5px; line-height:1.7; margin-bottom:14px;
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--cyan), #3FA9B8); color:#031015; border:none; border-radius:22px;
    padding:11px 20px; font-size:13px; font-weight:700; width:100%;
  }

  /* ----- photos ----- */
  .photo-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .photo-thumb{ position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--panel); }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; }
  .photo-modal{ position:fixed; inset:0; background:rgba(2,4,10,0.95); z-index:60; display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  .photo-modal.open{ display:flex; }
  .photo-modal img{ max-width:100%; max-height:65vh; border-radius:10px; }
  .photo-modal .cap{ color:var(--text); font-size:13px; margin-top:14px; text-align:center; }
  .photo-modal .close{ position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:18px; color:var(--text-dim); font-size:26px; }
  .photo-modal .del{ margin-top:16px; color:#E86A6A; font-size:12px; }

  /* ----- music / video list ----- */
  .track{
    display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--panel-line);
    border-radius:12px; padding:12px 14px; margin-bottom:10px;
  }
  .track .playicon{ width:38px; height:38px; border-radius:50%; background:var(--cyan-dim); display:flex; align-items:center; justify-content:center; color:#BDF8FF; font-size:14px; flex:0 0 auto; }
  .track.playing .playicon{ background:var(--gold); color:#2B2008; }
  .track .title{ font-size:13.5px; color:var(--text); }
  video{ width:100%; border-radius:12px; margin-bottom:14px; background:#000; }

  /* ----- planner ----- */
  .planner-date{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .planner-date input[type=date]{ background:var(--panel); border:1px solid var(--panel-line); border-radius:10px; padding:9px 12px; color:var(--text); font-size:13px; flex:1; }
  .task-row{ display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--panel-line); border-radius:12px; padding:11px 14px; margin-bottom:8px; }
  .task-row .chk{ width:20px; height:20px; border-radius:6px; border:1.5px solid var(--cyan-dim); flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:var(--cyan); font-size:13px; }
  .task-row.done .chk{ background:var(--cyan); color:#031015; }
  .task-row .txt{ flex:1; font-size:13.5px; color:var(--text); }
  .task-row.done .txt{ color:var(--text-dim); text-decoration:line-through; }
  .task-row .del{ color:#E86A6A; font-size:11px; flex:0 0 auto; }
  .add-task-row{ display:flex; gap:8px; margin-bottom:16px; }
  .add-task-row input{ flex:1; background:var(--panel); border:1px solid var(--panel-line); border-radius:10px; padding:10px 14px; color:var(--text); font-size:13px; }
  .add-task-row button{ background:var(--cyan); color:#031015; border:none; border-radius:10px; padding:0 16px; font-weight:700; }

  /* ---------- Bottom nav ---------- */
  .tabs{
    flex:0 0 auto; display:flex; background:#0A0F24; border-top:1px solid var(--panel-line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  }
  .tab{ flex:1; text-align:center; padding:7px 2px; border-radius:10px; color:var(--text-dim); font-size:10px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .tab .ico{ font-size:17px; }
  .tab.active{ color:var(--cyan); background:rgba(95,217,232,0.08); }

  input[type=file]{ display:none; }
</style>
</head>
<body>

<div id="startOverlay">
  <div class="ring"></div>
  <h1>ARIA</h1>
  <p>Namaste Didi 🌸<br>Main aapki apni saathi hoon.<br>Shuru karne ke liye yahan tap kijiye.</p>
  <button id="startBtn">Tap to Begin</button>
</div>

<div class="topbar">
  <div class="name">A R I A</div>
  <div class="sub" id="topDate"></div>
</div>

<!-- ARIA CHAT VIEW -->
<div class="view active" id="view-aria">
  <div class="orb-wrap">
    <div class="orb idle" id="orb"><div class="ring1"></div><div class="ring2"></div><div class="core"></div></div>
  </div>
  <div class="state-label" id="stateLabel">Taiyar hoon</div>
  <div class="chat" id="chat"></div>
  <div class="quickrow">
    <div class="quickchip" data-q="time kya hui hai">⏰ Time</div>
    <div class="quickchip" data-q="word of the day">📖 Word</div>
    <div class="quickchip" data-q="mujhe motivate karo">✨ Quote</div>
    <div class="quickchip" data-q="khat sunao">💌 Letter</div>
    <div class="quickchip" data-q="tum kya kar sakti ho">❓ Help</div>
  </div>
  <div class="controls">
    <input class="textinput" id="textInput" type="text" placeholder="Likhiye ya mic dabaiye...">
    <button class="sendbtn" id="sendBtn">➤</button>
    <button class="micbtn" id="micBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#031015" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line>
      </svg>
    </button>
  </div>
</div>

<!-- PHOTOS VIEW -->
<div class="view" id="view-photos">
  <div class="scrollview">
    <div class="section-title">Yaadein</div>
    <div id="photoGrid" class="photo-grid"></div>
    <button class="btn-primary" id="addPhotoBtn">+ Photo Add Karo</button>
    <input type="file" id="photoInput" accept="image/*">
  </div>
</div>

<!-- MUSIC VIEW -->
<div class="view" id="view-music">
  <div class="scrollview">
    <div class="section-title">Gaane</div>
    <div id="musicList"></div>
  </div>
</div>

<!-- VIDEOS VIEW -->
<div class="view" id="view-videos">
  <div class="scrollview">
    <div class="section-title">Videos</div>
    <div id="videoList"></div>
  </div>
</div>

<!-- PLANNER VIEW -->
<div class="view" id="view-planner">
  <div class="scrollview">
    <div class="section-title">Planner</div>
    <div class="planner-date">
      <input type="date" id="plannerDate">
    </div>
    <div class="add-task-row">
      <input type="text" id="taskInput" placeholder="Naya kaam likhiye...">
      <button id="addTaskBtn">+</button>
    </div>
    <div id="taskList"></div>
  </div>
</div>

<!-- PHOTO MODAL -->
<div class="photo-modal" id="photoModal">
  <div class="close" id="photoModalClose">✕</div>
  <img id="photoModalImg" src="">
  <div class="cap" id="photoModalCap"></div>
  <div class="del" id="photoModalDel">Delete Photo</div>
</div>

<div class="tabs">
  <div class="tab active" data-view="aria"><span class="ico">💬</span>ARIA</div>
  <div class="tab" data-view="photos"><span class="ico">📷</span>Photos</div>
  <div class="tab" data-view="music"><span class="ico">🎵</span>Music</div>
  <div class="tab" data-view="videos"><span class="ico">🎬</span>Videos</div>
  <div class="tab" data-view="planner"><span class="ico">📅</span>Planner</div>
</div>

<script>
/* ================= CONTENT ================= */
const WORDS_OF_DAY = [
  {w:"Resilient", m:"कठिनाइयों से जल्दी उबरने वाला", ex:"She remained resilient even after a difficult year."},
  {w:"Benevolent", m:"दयालु, परोपकारी", ex:"The benevolent teacher always helped struggling students."},
  {w:"Eloquent", m:"प्रभावशाली ढंग से बोलने वाला", ex:"Her eloquent speech moved the entire class."},
  {w:"Diligent", m:"मेहनती, लगनशील", ex:"A diligent student never gives up before exams."},
  {w:"Serene", m:"शांत, निर्मल", ex:"The campus felt serene in the early morning light."},
  {w:"Gratitude", m:"कृतज्ञता", ex:"She felt deep gratitude for her students' love."},
  {w:"Wholesome", m:"स्वस्थ और संतुलित, मंगलकारी", ex:"It was a wholesome evening filled with laughter."},
  {w:"Compassion", m:"करुणा", ex:"Her compassion for children made her a wonderful teacher."},
  {w:"Radiant", m:"चमकदार, तेजस्वी", ex:"Her smile was radiant even on a tiring day."},
  {w:"Steadfast", m:"दृढ़, अटल", ex:"He remained steadfast in his support for his sister."},
  {w:"Tranquil", m:"शांत, सुकूनभरा", ex:"The tranquil evenings on campus helped her relax."},
  {w:"Inspire", m:"प्रेरित करना", ex:"A good teacher doesn't just teach, she inspires."},
  {w:"Cherish", m:"संजोना, प्रिय मानना", ex:"I will always cherish our childhood memories."},
  {w:"Fortitude", m:"धैर्य और साहस", ex:"She faced every challenge with quiet fortitude."},
  {w:"Nurture", m:"पोषण करना, सहेजना", ex:"Teachers nurture dreams as much as they teach lessons."}
];
const QUOTES = [
  "Jitna aap doosron ko sikhate ho, utna hi khud bhi seekhte ho — aap ek wajah se itni khaas ho.",
  "Akela rehna kabhi kabhi mushkil hota hai, lekin aapne jitno ki zindagi roshan ki hai, unki duayein hamesha saath hain.",
  "Har bacha jo aapse padhkar aage badhta hai, wo aapka hi ek hissa apne saath le jaata hai.",
  "Sabse mazboot log wahi hote hain jo khud sambhal kar doosron ko bhi sambhalte hain — aap unmein se ek ho.",
  "Thoda sa thakna normal hai, par aap jo kar rahi ho uska asar bahut bada hai.",
  "Aapki muskaan kai logon ka din banati hai, kabhi khud ke liye bhi muskuraiye."
];
const LETTERS = [
  "Didi, pata nahi maine kabhi acche se bola ho ya nahi, lekin main aapko bahut miss karta hoon. Aap akeli campus mein rehti ho, padhati ho, sabka khayal rakhti ho — aur main chahta hoon aapko pata ho ki main aapke liye bahut proud hoon.",
  "Jab bhi main pareshan hota hoon, mujhe yaad aata hai ki aap kitni mushkilon ke baad bhi hamesha strong rehti ho. Aap meri sabse badi inspiration ho, Didi.",
  "Aap jitne bachon ko padhati ho, unke liye aap sirf teacher nahi, ek bahut bada support ho. Yeh cheez mujhe aapke baare mein sabse zyada proud karti hai.",
  "Happy Birthday Didi. Is saal, main chahta hoon aap thoda apna bhi khayal rakho — jitna aap doosron ka rakhti ho.",
  "Aapko gaane sunna pasand hai na? Jab bhi akela feel ho, ek gaana laga lena aur yaad rakhna ki door se hi sahi, main hamesha aapke saath hoon.",
  "Thank you Didi — sirf ek behen hone ke liye nahi, balki ek aisi insaan hone ke liye jo meri zindagi mein roshni ki tarah ho."
];
let wordIndex = Math.floor((Date.now()/86400000)) % WORDS_OF_DAY.length;
let letterIndex = 0;

/* Add your own songs/videos here — upload the actual files into a "songs" or
   "videos" folder next to this index.html in your GitHub repo, then add an
   entry below with the exact file name and a title. */
const SONGS = [
  // { file: "songs/mygaana.mp3", title: "Mera Gaana" },
];
const VIDEOS = [
  // { file: "videos/myvideo.mp4", title: "Mera Video" },
];

/* ================= ARIA chat logic (unchanged) ================= */
const chatEl = document.getElementById('chat');
const orb = document.getElementById('orb');
const stateLabel = document.getElementById('stateLabel');
const textInput = document.getElementById('textInput');
const micBtn = document.getElementById('micBtn');
const sendBtn = document.getElementById('sendBtn');

function setOrbState(state){
  orb.className = 'orb ' + state;
  stateLabel.textContent = state === 'listening' ? 'Sun rahi hoon...' : state === 'speaking' ? 'Bol rahi hoon...' : 'Taiyar hoon';
}
function addBubble(text, who){
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.innerHTML = who === 'aria' ? '<span class="tag">ARIA</span>' + text : '';
  if(who !== 'aria') div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function speak(text){
  addBubble(text, 'aria');
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.95; utter.pitch = 1.1; utter.lang = 'hi-IN';
    utter.onstart = ()=> setOrbState('speaking');
    utter.onend = ()=> setOrbState('idle');
    const voices = window.speechSynthesis.getVoices();
    const hiVoice = voices.find(v=>v.lang && v.lang.startsWith('hi'));
    const femaleVoice = voices.find(v=>/female/i.test(v.name));
    if(hiVoice) utter.voice = hiVoice; else if(femaleVoice) utter.voice = femaleVoice;
    window.speechSynthesis.speak(utter);
  }
}
function processCommand(raw){
  const q = raw.toLowerCase().trim();
  addBubble(raw, 'user');
  if(/time|samay|baj/.test(q)){ const now=new Date(); speak(`Abhi ${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})} baje hain, Didi.`); return; }
  if(/date|tareekh|din kaunsa|aaj kya/.test(q)){ const now=new Date(); speak(`Aaj ${now.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} hai.`); return; }
  if(/word of the day|shabd|word/.test(q)){ const item=WORDS_OF_DAY[wordIndex%WORDS_OF_DAY.length]; wordIndex++; speak(`Aaj ka word hai — ${item.w}. Matlab: ${item.m}. Example: ${item.ex}`); return; }
  if(/motivate|quote|inspire|himmat/.test(q)){ speak(QUOTES[Math.floor(Math.random()*QUOTES.length)]); return; }
  if(/khat|letter|message|yaad dilao/.test(q)){ const letter=LETTERS[letterIndex%LETTERS.length]; letterIndex++; speak(letter); return; }
  if(/happy birthday|birthday/.test(q)){ speak("Happy Birthday Didi! Aap jitni khaas ho, utni hi khushiyan aapko milein. Main aapse bahut pyaar karta hoon."); return; }
  if(/play |gaana|gaane|song/.test(q)){
    const songQuery = raw.replace(/play/i,'').replace(/gaana|gaane|song|bajao|chalao/gi,'').trim() || 'relaxing hindi songs';
    speak(`${songQuery} khol rahi hoon.`);
    window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(songQuery), '_blank');
    return;
  }
  if(/kaun ho|who are you|tumhara naam/.test(q)){ speak("Main ARIA hoon, aapki apni saathi — hamesha aapke liye yahan."); return; }
  if(/kaisi ho|how are you/.test(q)){ speak("Main bilkul theek hoon Didi, aap batao aap kaisi ho?"); return; }
  if(/thank|shukriya|dhanyavad/.test(q)){ speak("Koi baat nahi Didi, main hamesha yahan hoon aapke liye."); return; }
  if(/kya kar sakti ho|help|madad/.test(q)){ speak("Main time, date bata sakti hoon, roz ek naya word sikha sakti hoon, aapko motivate kar sakti hoon, gaane dhoondh sakti hoon, aur aapke bhai ke khat bhi sunati hoon. Bas poochiye."); return; }
  speak("Yeh main abhi samajh nahi payi, Didi. Aap time, date, word of the day, ya khat poochkar dekhiye.");
}
function handleSend(){ const val=textInput.value.trim(); if(!val) return; processCommand(val); textInput.value=''; }
sendBtn.addEventListener('click', handleSend);
textInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleSend(); });
document.querySelectorAll('.quickchip').forEach(chip=> chip.addEventListener('click', ()=> processCommand(chip.dataset.q)));

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, isListening = false;
if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.lang = 'hi-IN'; recognition.interimResults = false; recognition.maxAlternatives = 1;
  recognition.onstart = ()=>{ isListening=true; micBtn.classList.add('active'); setOrbState('listening'); };
  recognition.onend = ()=>{ isListening=false; micBtn.classList.remove('active'); setOrbState('idle'); };
  recognition.onerror = ()=>{ isListening=false; micBtn.classList.remove('active'); setOrbState('idle'); };
  recognition.onresult = (e)=> processCommand(e.results[0][0].transcript);
  micBtn.addEventListener('click', ()=>{ if(isListening){ recognition.stop(); return; } try{ recognition.start(); }catch(e){} });
} else {
  micBtn.addEventListener('click', ()=> speak("Is browser mein voice sunna possible nahi hai, aap type karke poochiye."));
}

/* ================= Tab navigation ================= */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-'+tab.dataset.view).classList.add('active');
  });
});

/* ================= Photos ================= */
let photos = [];
function loadPhotos(){ try{ const p = localStorage.getItem('aria-photos'); photos = p ? JSON.parse(p) : []; }catch(e){ photos = []; } }
function savePhotos(){ try{ localStorage.setItem('aria-photos', JSON.stringify(photos)); }catch(e){ alert('Photo save nahi ho payi — storage full ho sakta hai. Kam photos rakhiye.'); } }
function renderPhotos(){
  const grid = document.getElementById('photoGrid');
  if(photos.length === 0){
    grid.innerHTML = '';
    grid.insertAdjacentHTML('afterend', '');
    document.getElementById('photoGrid').style.display='none';
    if(!document.getElementById('photoEmpty')){
      const div = document.createElement('div');
      div.className='empty-card'; div.id='photoEmpty';
      div.innerHTML = 'Abhi koi photo nahi hai.<br>Neeche se apni pyaari yaadein add kijiye 💛';
      grid.parentNode.insertBefore(div, grid);
    }
    return;
  }
  const existingEmpty = document.getElementById('photoEmpty');
  if(existingEmpty) existingEmpty.remove();
  grid.style.display='grid';
  grid.innerHTML = photos.map((p,i)=>`<div class="photo-thumb" data-i="${i}"><img src="${p.data}"></div>`).join('');
  grid.querySelectorAll('.photo-thumb').forEach(el=>{
    el.addEventListener('click', ()=> openPhotoModal(+el.dataset.i));
  });
}
function openPhotoModal(i){
  const p = photos[i];
  document.getElementById('photoModalImg').src = p.data;
  document.getElementById('photoModalCap').textContent = p.caption || '';
  document.getElementById('photoModal').classList.add('open');
  document.getElementById('photoModalDel').onclick = ()=>{
    if(confirm('Yeh photo delete karein?')){
      photos.splice(i,1); savePhotos(); renderPhotos();
      document.getElementById('photoModal').classList.remove('open');
    }
  };
}
document.getElementById('photoModalClose').addEventListener('click', ()=> document.getElementById('photoModal').classList.remove('open'));

document.getElementById('addPhotoBtn').addEventListener('click', ()=> document.getElementById('photoInput').click());
document.getElementById('photoInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 900;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h * maxDim/w); w = maxDim; } else { w = Math.round(w * maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      const caption = prompt('Is photo ke liye ek caption likhein (optional):') || '';
      photos.push({data: dataUrl, caption});
      savePhotos(); renderPhotos();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

/* ================= Music ================= */
function renderMusic(){
  const el = document.getElementById('musicList');
  if(SONGS.length === 0){
    el.innerHTML = '<div class="empty-card">Abhi koi gaana add nahi hua hai.<br><br>Apne gaane add karne ke liye: GitHub repo mein ek "songs" folder banayein, usme mp3 files upload karein, aur index.html ke top mein SONGS list mein unka naam add kar dein.<br><br>Tab tak, ARIA se bolkar "gaana bajao [naam]" bhi kaam karega — YouTube khul jaayega.</div>';
    return;
  }
  el.innerHTML = SONGS.map((s,i)=>`
    <div class="track" id="track-${i}">
      <div class="playicon" data-i="${i}">▶</div>
      <div class="title">${s.title}</div>
      <audio id="audio-${i}" src="${s.file}" preload="none"></audio>
    </div>`).join('');
  let currentAudio = null, currentIdx = null;
  el.querySelectorAll('.playicon').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = +btn.dataset.i;
      const audio = document.getElementById('audio-'+i);
      const trackEl = document.getElementById('track-'+i);
      if(currentAudio && currentIdx !== i){ currentAudio.pause(); document.getElementById('track-'+currentIdx).classList.remove('playing'); document.querySelector('#track-'+currentIdx+' .playicon').textContent='▶'; }
      if(audio.paused){ audio.play(); trackEl.classList.add('playing'); btn.textContent='❚❚'; currentAudio=audio; currentIdx=i; }
      else { audio.pause(); trackEl.classList.remove('playing'); btn.textContent='▶'; }
    });
  });
}

/* ================= Videos ================= */
function renderVideos(){
  const el = document.getElementById('videoList');
  if(VIDEOS.length === 0){
    el.innerHTML = '<div class="empty-card">Abhi koi video add nahi hua hai.<br><br>Video add karne ke liye: GitHub repo mein ek "videos" folder banayein, mp4 file upload karein, aur index.html ke top mein VIDEOS list mein uska naam add kar dein.</div>';
    return;
  }
  el.innerHTML = VIDEOS.map(v=>`<div style="margin-bottom:16px"><video controls src="${v.file}"></video><div class="title" style="margin-top:6px">${v.title}</div></div>`).join('');
}

/* ================= Planner ================= */
let plannerData = {};
function loadPlanner(){ try{ const p = localStorage.getItem('aria-planner'); plannerData = p ? JSON.parse(p) : {}; }catch(e){ plannerData = {}; } }
function savePlanner(){ try{ localStorage.setItem('aria-planner', JSON.stringify(plannerData)); }catch(e){} }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function renderTasks(){
  const dateEl = document.getElementById('plannerDate');
  const date = dateEl.value || todayStr();
  const tasks = plannerData[date] || [];
  const list = document.getElementById('taskList');
  if(tasks.length === 0){ list.innerHTML = '<div class="empty-card">Is din ke liye koi kaam nahi likha hai.</div>'; return; }
  list.innerHTML = tasks.map((t,i)=>`
    <div class="task-row ${t.done?'done':''}" data-i="${i}">
      <div class="chk">${t.done?'✓':''}</div>
      <div class="txt">${t.text}</div>
      <div class="del">Delete</div>
    </div>`).join('');
  list.querySelectorAll('.chk').forEach(el=> el.addEventListener('click', ()=>{
    const i = +el.closest('.task-row').dataset.i;
    tasks[i].done = !tasks[i].done; plannerData[date]=tasks; savePlanner(); renderTasks();
  }));
  list.querySelectorAll('.del').forEach(el=> el.addEventListener('click', ()=>{
    const i = +el.closest('.task-row').dataset.i;
    tasks.splice(i,1); plannerData[date]=tasks; savePlanner(); renderTasks();
  }));
}
document.getElementById('plannerDate').value = todayStr();
document.getElementById('plannerDate').addEventListener('change', renderTasks);
document.getElementById('addTaskBtn').addEventListener('click', ()=>{
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if(!text) return;
  const date = document.getElementById('plannerDate').value || todayStr();
  if(!plannerData[date]) plannerData[date] = [];
  plannerData[date].push({text, done:false});
  savePlanner(); input.value=''; renderTasks();
});
document.getElementById('taskInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') document.getElementById('addTaskBtn').click(); });

/* ================= Boot ================= */
function updateTopDate(){
  const now = new Date();
  document.getElementById('topDate').textContent = now.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}) + '  ·  ' + now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
updateTopDate(); setInterval(updateTopDate, 30000);

function greet(){
  const hour = new Date().getHours();
  let greeting = hour < 12 ? "Good Morning" : hour < 17 ? "Good Afternoon" : "Good Evening";
  speak(`${greeting} Didi! Main ARIA hoon, aapki apni saathi. Aap mujhse time, word of the day, ya ek pyaara khat bhi pooch sakti hain.`);
}
document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('startOverlay').style.display = 'none';
  if('speechSynthesis' in window){ window.speechSynthesis.getVoices(); }
  setTimeout(greet, 300);
});

loadPhotos(); renderPhotos();
renderMusic();
renderVideos();
loadPlanner(); renderTasks();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
